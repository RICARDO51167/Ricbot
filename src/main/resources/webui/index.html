<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ricbot</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --panel-2: #eef3f0;
      --text: #1d232b;
      --muted: #657180;
      --line: #d8dee6;
      --accent: #24745a;
      --accent-2: #1956a3;
      --danger: #b42318;
      --shadow: 0 10px 28px rgba(28, 39, 55, 0.10);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
    }

    button, input, textarea {
      font: inherit;
    }

    .shell {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      min-height: 100vh;
    }

    aside {
      background: #ffffff;
      border-right: 1px solid var(--line);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 40px;
    }

    .brand h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.1;
      font-weight: 760;
      letter-spacing: 0;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #9aa4b2;
    }

    .dot.ok { background: #15955a; }
    .dot.err { background: var(--danger); }

    .field {
      display: grid;
      gap: 6px;
    }

    label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      outline: none;
    }

    input {
      height: 38px;
      padding: 0 10px;
    }

    textarea {
      min-height: 54px;
      max-height: 180px;
      resize: vertical;
      padding: 10px 12px;
      line-height: 1.45;
    }

    input:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(36, 116, 90, 0.14);
    }

    .session-list {
      display: grid;
      gap: 6px;
      overflow: auto;
      min-height: 80px;
    }

    .session-button {
      width: 100%;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      text-align: left;
      min-height: 36px;
      border-radius: 8px;
      padding: 8px 10px;
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .session-button:hover {
      background: var(--panel-2);
    }

    .session-button.active {
      border-color: rgba(36, 116, 90, 0.35);
      background: #e7f3ee;
      color: #153f32;
      font-weight: 700;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 13px;
      user-select: none;
    }

    .toggle input {
      width: 16px;
      height: 16px;
    }

    .btn {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      min-height: 36px;
      border-radius: 8px;
      padding: 0 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn:hover {
      border-color: #b8c2ce;
      background: #f9fafb;
    }

    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .btn.primary:hover {
      background: #1d654e;
    }

    .btn.icon {
      width: 36px;
      padding: 0;
    }

    main {
      min-width: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
    }

    header {
      min-height: 64px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.86);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 22px;
    }

    .title {
      min-width: 0;
    }

    .title h2 {
      margin: 0;
      font-size: 17px;
      line-height: 1.25;
      font-weight: 760;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .meta {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
    }

    .messages {
      min-height: 0;
      overflow: auto;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .empty {
      margin: auto;
      max-width: 520px;
      text-align: center;
      color: var(--muted);
      line-height: 1.55;
    }

    .msg {
      max-width: min(820px, 88%);
      display: grid;
      gap: 5px;
    }

    .msg.user {
      align-self: flex-end;
    }

    .msg.assistant {
      align-self: flex-start;
    }

    .role {
      font-size: 12px;
      color: var(--muted);
      padding: 0 2px;
    }

    .bubble {
      border-radius: 8px;
      padding: 11px 13px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
      box-shadow: var(--shadow);
    }

    .user .bubble {
      background: #1f5fbb;
      color: #fff;
      box-shadow: none;
    }

    .assistant .bubble {
      background: var(--panel);
      border: 1px solid var(--line);
    }

    .composer {
      border-top: 1px solid var(--line);
      background: #fff;
      padding: 14px 22px;
      display: grid;
      gap: 10px;
    }

    .composer-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: end;
    }

    .error {
      color: var(--danger);
      font-size: 13px;
      min-height: 18px;
    }

    @media (max-width: 820px) {
      .shell {
        grid-template-columns: 1fr;
      }

      aside {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .session-list {
        grid-auto-flow: column;
        grid-auto-columns: minmax(140px, 1fr);
        overflow-x: auto;
      }

      header {
        padding: 12px 14px;
      }

      .messages {
        padding: 14px;
      }

      .msg {
        max-width: 96%;
      }

      .composer {
        padding: 12px 14px;
      }

      .composer-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside>
      <div class="brand">
        <h1>Ricbot</h1>
        <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">Checking</span></div>
      </div>

      <div class="field">
        <label for="sessionInput">Session</label>
        <input id="sessionInput" autocomplete="off" spellcheck="false">
      </div>

      <div class="field">
        <label for="tokenInput">Bearer token</label>
        <input id="tokenInput" type="password" autocomplete="off" spellcheck="false">
      </div>

      <div class="toolbar">
        <button class="btn primary" id="newSessionBtn" type="button">New</button>
        <button class="btn" id="clearBtn" type="button">Clear</button>
        <label class="toggle"><input id="streamToggle" type="checkbox" checked> Stream</label>
      </div>

      <div class="field">
        <label>Recent</label>
        <div class="session-list" id="sessionList"></div>
      </div>
    </aside>

    <main>
      <header>
        <div class="title">
          <h2 id="sessionTitle"></h2>
          <div class="meta" id="modelMeta">Model: ...</div>
        </div>
        <button class="btn icon" id="refreshBtn" type="button" title="Refresh status" aria-label="Refresh status">↻</button>
      </header>

      <section class="messages" id="messages"></section>

      <form class="composer" id="composer">
        <div class="error" id="errorText"></div>
        <div class="composer-row">
          <textarea id="promptInput" placeholder="输入消息..." autocomplete="off"></textarea>
          <div class="toolbar">
            <button class="btn" id="stopBtn" type="button" disabled>Stop</button>
            <button class="btn primary" id="sendBtn" type="submit">Send</button>
          </div>
        </div>
      </form>
    </main>
  </div>

  <script>
    const state = {
      sessions: {},
      current: "",
      model: "ricbot",
      controller: null,
      busy: false
    };

    const els = {
      statusDot: document.getElementById("statusDot"),
      statusText: document.getElementById("statusText"),
      sessionInput: document.getElementById("sessionInput"),
      tokenInput: document.getElementById("tokenInput"),
      streamToggle: document.getElementById("streamToggle"),
      sessionList: document.getElementById("sessionList"),
      sessionTitle: document.getElementById("sessionTitle"),
      modelMeta: document.getElementById("modelMeta"),
      messages: document.getElementById("messages"),
      composer: document.getElementById("composer"),
      promptInput: document.getElementById("promptInput"),
      errorText: document.getElementById("errorText"),
      sendBtn: document.getElementById("sendBtn"),
      stopBtn: document.getElementById("stopBtn"),
      newSessionBtn: document.getElementById("newSessionBtn"),
      clearBtn: document.getElementById("clearBtn"),
      refreshBtn: document.getElementById("refreshBtn")
    };

    function storageKey() {
      return "ricbot.webui.v1";
    }

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey()) || "{}");
        state.sessions = saved.sessions || {};
        state.current = saved.current || "";
        els.streamToggle.checked = saved.stream !== false;
        els.tokenInput.value = sessionStorage.getItem("ricbot.webui.token") || "";
      } catch (_) {
        state.sessions = {};
      }
      if (!state.current || !state.sessions[state.current]) {
        createSession(false);
      }
    }

    function saveState() {
      localStorage.setItem(storageKey(), JSON.stringify({
        sessions: state.sessions,
        current: state.current,
        stream: els.streamToggle.checked
      }));
      sessionStorage.setItem("ricbot.webui.token", els.tokenInput.value.trim());
    }

    function createSession(render = true) {
      const id = "web-" + new Date().toISOString().replace(/[-:.TZ]/g, "").slice(0, 14);
      state.sessions[id] = [];
      state.current = id;
      els.sessionInput.value = id;
      saveState();
      if (render) renderAll();
      return id;
    }

    function currentMessages() {
      if (!state.sessions[state.current]) state.sessions[state.current] = [];
      return state.sessions[state.current];
    }

    function setBusy(value) {
      state.busy = value;
      els.sendBtn.disabled = value;
      els.stopBtn.disabled = !value;
      els.promptInput.disabled = value;
    }

    function headers() {
      const out = {"Content-Type": "application/json"};
      const token = els.tokenInput.value.trim();
      if (token) out.Authorization = "Bearer " + token;
      return out;
    }

    async function refreshStatus() {
      clearError();
      try {
        const health = await fetch("/health", {headers: headers()});
        if (!health.ok) throw new Error(await readError(health));
        const models = await fetch("/v1/models", {headers: headers()});
        if (!models.ok) throw new Error(await readError(models));
        const modelJson = await models.json();
        const first = modelJson.data && modelJson.data[0];
        state.model = first && first.id ? first.id : "ricbot";
        els.modelMeta.textContent = "Model: " + state.model;
        setStatus("ok", "Ready");
      } catch (err) {
        setStatus("err", "Auth needed");
        showError(err.message || String(err));
      }
    }

    function setStatus(kind, text) {
      els.statusDot.className = "dot " + (kind || "");
      els.statusText.textContent = text;
    }

    async function readError(response) {
      try {
        const json = await response.json();
        return json.error && json.error.message ? json.error.message : response.statusText;
      } catch (_) {
        return response.status + " " + response.statusText;
      }
    }

    function showError(text) {
      els.errorText.textContent = text || "";
    }

    function clearError() {
      els.errorText.textContent = "";
    }

    function renderAll() {
      els.sessionInput.value = state.current;
      els.sessionTitle.textContent = state.current;
      renderSessions();
      renderMessages();
    }

    function renderSessions() {
      els.sessionList.textContent = "";
      const ids = Object.keys(state.sessions).sort().reverse();
      for (const id of ids) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "session-button" + (id === state.current ? " active" : "");
        button.textContent = id;
        button.title = id;
        button.addEventListener("click", () => {
          state.current = id;
          saveState();
          renderAll();
        });
        els.sessionList.appendChild(button);
      }
    }

    function renderMessages() {
      els.messages.textContent = "";
      const list = currentMessages();
      if (list.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "开始一个会话。";
        els.messages.appendChild(empty);
        return;
      }
      for (const msg of list) {
        appendMessageElement(msg);
      }
      scrollMessages();
    }

    function appendMessageElement(msg) {
      const wrapper = document.createElement("article");
      wrapper.className = "msg " + msg.role;
      const role = document.createElement("div");
      role.className = "role";
      role.textContent = msg.role === "user" ? "You" : "Ricbot";
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = msg.content || "";
      wrapper.append(role, bubble);
      els.messages.appendChild(wrapper);
      msg._el = bubble;
      return bubble;
    }

    function scrollMessages() {
      els.messages.scrollTop = els.messages.scrollHeight;
    }

    async function sendMessage(text) {
      clearError();
      const messages = currentMessages();
      const user = {role: "user", content: text};
      const assistant = {role: "assistant", content: ""};
      messages.push(user, assistant);
      saveState();
      renderMessages();
      setBusy(true);
      state.controller = new AbortController();

      try {
        if (els.streamToggle.checked) {
          await sendStreaming(messages, assistant);
        } else {
          await sendBlocking(messages, assistant);
        }
        saveState();
      } catch (err) {
        if (err.name !== "AbortError") {
          assistant.content = assistant.content || "请求失败。";
          showError(err.message || String(err));
        }
      } finally {
        state.controller = null;
        setBusy(false);
        renderMessages();
      }
    }

    async function sendBlocking(messages, assistant) {
      const payload = requestPayload(messages, false);
      const response = await fetch("/v1/chat/completions", {
        method: "POST",
        headers: headers(),
        body: JSON.stringify(payload),
        signal: state.controller.signal
      });
      if (!response.ok) throw new Error(await readError(response));
      const json = await response.json();
      const choice = json.choices && json.choices[0];
      assistant.content = choice && choice.message ? choice.message.content || "" : "";
    }

    async function sendStreaming(messages, assistant) {
      const payload = requestPayload(messages, true);
      const response = await fetch("/v1/chat/completions", {
        method: "POST",
        headers: headers(),
        body: JSON.stringify(payload),
        signal: state.controller.signal
      });
      if (!response.ok) throw new Error(await readError(response));
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      while (true) {
        const {done, value} = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, {stream: true});
        const parts = buffer.split("\n\n");
        buffer = parts.pop() || "";
        for (const part of parts) {
          consumeSse(part, assistant);
        }
      }
      if (buffer) consumeSse(buffer, assistant);
    }

    function consumeSse(block, assistant) {
      const lines = block.split("\n").filter(line => line.startsWith("data:"));
      for (const line of lines) {
        const data = line.slice(5).trim();
        if (!data || data === "[DONE]") continue;
        try {
          const json = JSON.parse(data);
          const choice = json.choices && json.choices[0];
          const delta = choice && choice.delta;
          if (delta && delta.content) {
            assistant.content += delta.content;
            if (assistant._el) assistant._el.textContent = assistant.content;
            scrollMessages();
          }
        } catch (_) {
        }
      }
    }

    function requestPayload(messages, stream) {
      const outbound = messages.slice();
      const last = outbound[outbound.length - 1];
      if (last && last.role === "assistant" && !last.content) {
        outbound.pop();
      }
      return {
        model: state.model,
        session_id: state.current,
        stream,
        messages: outbound
          .filter(msg => msg.role === "user" || msg.role === "assistant")
          .map(msg => ({role: msg.role, content: msg.content || ""}))
      };
    }

    els.composer.addEventListener("submit", event => {
      event.preventDefault();
      const text = els.promptInput.value.trim();
      if (!text || state.busy) return;
      els.promptInput.value = "";
      sendMessage(text);
    });

    els.promptInput.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        els.composer.requestSubmit();
      }
    });

    els.stopBtn.addEventListener("click", () => {
      if (state.controller) state.controller.abort();
    });

    els.newSessionBtn.addEventListener("click", () => createSession(true));

    els.clearBtn.addEventListener("click", () => {
      state.sessions[state.current] = [];
      saveState();
      renderMessages();
    });

    els.refreshBtn.addEventListener("click", refreshStatus);

    els.sessionInput.addEventListener("change", () => {
      const value = els.sessionInput.value.trim();
      if (!value) {
        els.sessionInput.value = state.current;
        return;
      }
      if (!state.sessions[value]) state.sessions[value] = [];
      state.current = value;
      saveState();
      renderAll();
    });

    els.tokenInput.addEventListener("change", () => {
      saveState();
      refreshStatus();
    });

    els.streamToggle.addEventListener("change", saveState);

    loadState();
    renderAll();
    refreshStatus();
  </script>
</body>
</html>

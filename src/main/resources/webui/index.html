<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ricbot</title>
  <style>
	    :root {
	      color-scheme: light;
	      --bg: #eef1f5;
	      --panel: #ffffff;
	      --panel-2: #f5f7fa;
	      --text: #17202a;
	      --muted: #667384;
	      --line: #d9e0e8;
	      --line-strong: #c7d0dc;
	      --accent: #1f6f5b;
	      --accent-2: #245ca8;
	      --danger: #b42318;
	      --shadow: 0 18px 44px rgba(22, 32, 45, 0.10);
	      --shadow-soft: 0 8px 22px rgba(22, 32, 45, 0.07);
	      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
	    }

	    * { box-sizing: border-box; }

	    html {
	      height: 100%;
	      overflow: hidden;
	    }

	    body {
	      margin: 0;
	      height: 100%;
	      overflow: hidden;
	      background: var(--bg);
	      color: var(--text);
	    }

    button, input, textarea {
      font: inherit;
    }

	    .shell {
	      display: grid;
	      grid-template-columns: 304px minmax(0, 1fr);
	      height: 100vh;
	      min-height: 0;
	      overflow: hidden;
	    }

	    aside {
	      height: 100vh;
	      min-height: 0;
	      overflow: hidden;
	      background: #fbfcfd;
	      border-right: 1px solid var(--line);
	      padding: 20px;
	      display: flex;
	      flex-direction: column;
	      gap: 18px;
	      box-shadow: 10px 0 28px rgba(22, 32, 45, 0.04);
	    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 40px;
    }

	    .brand h1 {
	      margin: 0;
	      font-size: 23px;
	      line-height: 1.1;
	      font-weight: 780;
	      letter-spacing: 0;
	    }

	    .status {
	      display: inline-flex;
	      align-items: center;
	      gap: 8px;
	      color: var(--muted);
	      font-size: 12px;
	      font-weight: 650;
	      white-space: nowrap;
	      background: #f1f4f7;
	      border: 1px solid #e2e8ef;
	      border-radius: 999px;
	      min-height: 28px;
	      padding: 0 10px;
	    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #9aa4b2;
    }

    .dot.ok { background: #15955a; }
    .dot.err { background: var(--danger); }

	    .field {
	      display: grid;
	      gap: 7px;
	    }

	    aside > .field:last-child {
	      min-height: 0;
	      flex: 1;
	    }

	    label {
	      color: var(--muted);
	      font-size: 12px;
	      font-weight: 720;
	    }

	    input, textarea {
	      width: 100%;
	      border: 1px solid var(--line);
	      border-radius: 8px;
	      background: #fff;
	      color: var(--text);
	      outline: none;
	      transition: border-color 120ms ease, box-shadow 120ms ease, background 120ms ease;
	    }

	    input {
	      height: 40px;
	      padding: 0 11px;
	    }

    textarea {
      min-height: 54px;
      max-height: 180px;
      resize: vertical;
      padding: 10px 12px;
      line-height: 1.45;
    }

	    input:focus, textarea:focus {
	      border-color: var(--accent);
	      box-shadow: 0 0 0 3px rgba(31, 111, 91, 0.14);
	    }

	    .session-list {
	      display: grid;
	      gap: 6px;
	      overflow: auto;
	      min-height: 0;
	      align-content: start;
	      padding-right: 2px;
	    }

	    .session-button {
	      width: 100%;
	      border: 1px solid transparent;
	      background: transparent;
	      color: var(--text);
	      text-align: left;
	      min-height: 38px;
	      border-radius: 8px;
	      padding: 8px 11px;
	      cursor: pointer;
	      overflow: hidden;
	      text-overflow: ellipsis;
	      white-space: nowrap;
	      transition: background 120ms ease, border-color 120ms ease, color 120ms ease;
	    }

	    .session-button:hover {
	      background: #f1f5f7;
	    }

	    .session-button.active {
	      border-color: rgba(31, 111, 91, 0.30);
	      background: #e6f1ed;
	      color: #153f32;
	      font-weight: 700;
	    }

    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

	    .toggle {
	      display: inline-flex;
	      align-items: center;
	      gap: 7px;
	      color: var(--muted);
	      font-size: 13px;
	      font-weight: 650;
	      user-select: none;
	    }

    .toggle input {
      width: 16px;
      height: 16px;
    }

	    .btn {
	      border: 1px solid var(--line-strong);
	      background: #fff;
	      color: var(--text);
	      min-height: 38px;
	      border-radius: 8px;
	      padding: 0 13px;
	      cursor: pointer;
	      display: inline-flex;
	      align-items: center;
	      justify-content: center;
	      gap: 6px;
	      font-weight: 690;
	      box-shadow: 0 1px 1px rgba(22, 32, 45, 0.04);
	      transition: transform 120ms ease, border-color 120ms ease, background 120ms ease, box-shadow 120ms ease;
	    }

	    .btn:hover {
	      border-color: #aeb9c6;
	      background: #f9fafb;
	      box-shadow: var(--shadow-soft);
	    }

	    .btn:active {
	      transform: translateY(1px);
	    }

	    .btn:disabled {
	      cursor: not-allowed;
	      opacity: 0.55;
	      box-shadow: none;
	    }

    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

	    .btn.primary:hover {
	      background: #185c4b;
	    }

    .btn.icon {
      width: 36px;
      padding: 0;
    }

	    main {
	      min-width: 0;
	      height: 100vh;
	      min-height: 0;
	      overflow: hidden;
	      display: grid;
	      grid-template-rows: auto minmax(0, 1fr) auto;
	    }

	    .content-grid {
	      min-height: 0;
	      overflow: hidden;
	      display: grid;
	      grid-template-columns: minmax(0, 1fr) 360px;
	    }

	    .content-grid.trace-hidden {
	      grid-template-columns: minmax(0, 1fr);
	    }

	    header {
	      min-height: 68px;
	      border-bottom: 1px solid var(--line);
	      background: rgba(255, 255, 255, 0.92);
	      backdrop-filter: blur(10px);
	      display: flex;
	      align-items: center;
	      justify-content: space-between;
	      gap: 16px;
	      padding: 13px 24px;
	      z-index: 2;
	    }

    .title {
      min-width: 0;
    }

	    .title h2 {
	      margin: 0;
	      font-size: 18px;
	      line-height: 1.25;
	      font-weight: 780;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .meta {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
    }

	    .messages {
	      min-height: 0;
	      overflow: auto;
	      padding: 26px;
	      display: flex;
	      flex-direction: column;
	      gap: 14px;
	      background: #f4f6f8;
	      scrollbar-gutter: stable;
	    }

	    .trace-panel {
	      min-height: 0;
	      overflow: auto;
	      border-left: 1px solid var(--line);
	      background: #fbfcfd;
	      padding: 18px;
	      display: grid;
	      align-content: start;
	      gap: 12px;
	    }

	    .trace-panel[hidden] {
	      display: none;
	    }

	    .trace-head {
	      display: flex;
	      justify-content: space-between;
	      align-items: center;
	      gap: 10px;
	    }

	    .trace-head h3 {
	      margin: 0;
	      font-size: 14px;
	      line-height: 1.25;
	    }

	    .trace-meta {
	      color: var(--muted);
	      font-size: 12px;
	      line-height: 1.45;
	    }

	    .trace-list {
	      display: grid;
	      gap: 8px;
	    }

	    .mcp-list {
	      display: grid;
	      gap: 10px;
	    }

	    .trace-item {
	      border: 1px solid var(--line);
	      background: #fff;
	      border-radius: 8px;
	      padding: 10px;
	      display: grid;
	      gap: 5px;
	    }

	    .mcp-item {
	      border: 1px solid var(--line);
	      background: #fff;
	      border-radius: 8px;
	      padding: 10px;
	      display: grid;
	      gap: 6px;
	    }

	    .mcp-item strong {
	      font-size: 12px;
	    }

	    .mcp-item span {
	      color: var(--muted);
	      font-size: 12px;
	      line-height: 1.45;
	    }

	    .trace-item strong {
	      font-size: 12px;
	    }

	    .trace-item code {
	      color: var(--muted);
	      font-size: 12px;
	      white-space: pre-wrap;
	      word-break: break-word;
	    }

    .empty {
      margin: auto;
      max-width: 520px;
      text-align: center;
      color: var(--muted);
      line-height: 1.55;
    }

	    .msg {
	      max-width: min(860px, 86%);
	      display: grid;
	      gap: 6px;
	    }

    .msg.user {
      align-self: flex-end;
    }

    .msg.assistant {
      align-self: flex-start;
    }

	    .role {
	      font-size: 12px;
	      color: var(--muted);
	      padding: 0 2px;
	      font-weight: 680;
	    }

	    .bubble {
	      border-radius: 8px;
	      padding: 12px 14px;
	      line-height: 1.6;
	      white-space: pre-wrap;
	      word-break: break-word;
	      box-shadow: var(--shadow-soft);
	    }

	    .user .bubble {
	      background: #245ca8;
	      color: #fff;
	      box-shadow: 0 10px 28px rgba(36, 92, 168, 0.18);
	    }

	    .assistant .bubble {
	      background: var(--panel);
	      border: 1px solid var(--line);
    }

	    .composer {
	      border-top: 1px solid var(--line);
	      background: rgba(255, 255, 255, 0.96);
	      padding: 15px 24px 18px;
	      display: grid;
	      gap: 10px;
	      z-index: 2;
	    }

    .composer-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: end;
    }

	    .error {
	      color: var(--danger);
	      font-size: 13px;
	      min-height: 18px;
	      font-weight: 620;
	    }

	    @media (max-width: 820px) {
	      html, body {
	        overflow: auto;
	      }

	      .shell {
	        grid-template-columns: 1fr;
	        height: auto;
	        min-height: 100vh;
	        overflow: visible;
	      }

	      aside {
	        height: auto;
	        overflow: visible;
	        border-right: 0;
	        border-bottom: 1px solid var(--line);
	      }

	      main {
	        height: calc(100vh - 210px);
	        min-height: 560px;
	      }

	      .content-grid {
	        grid-template-columns: 1fr;
	      }

	      .trace-panel {
	        border-left: 0;
	        border-top: 1px solid var(--line);
	        max-height: 320px;
	      }

      .session-list {
        grid-auto-flow: column;
        grid-auto-columns: minmax(140px, 1fr);
        overflow-x: auto;
      }

      header {
        padding: 12px 14px;
      }

      .messages {
        padding: 14px;
      }

      .msg {
        max-width: 96%;
      }

      .composer {
        padding: 12px 14px;
      }

      .composer-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside>
      <div class="brand">
        <h1>Ricbot</h1>
        <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">Checking</span></div>
      </div>

      <div class="field">
        <label for="sessionInput">Session</label>
        <input id="sessionInput" autocomplete="off" spellcheck="false">
      </div>

      <div class="field">
        <label for="tokenInput">Bearer token</label>
        <input id="tokenInput" type="password" autocomplete="off" spellcheck="false">
      </div>

      <div class="toolbar">
        <button class="btn primary" id="newSessionBtn" type="button">New</button>
        <button class="btn" id="clearBtn" type="button">Clear</button>
        <label class="toggle"><input id="streamToggle" type="checkbox" checked> Stream</label>
      </div>

      <div class="field">
        <label>Recent</label>
        <div class="session-list" id="sessionList"></div>
      </div>
    </aside>

    <main>
      <header>
        <div class="title">
          <h2 id="sessionTitle"></h2>
          <div class="meta" id="modelMeta">Model: ...</div>
        </div>
        <div class="toolbar">
          <button class="btn" id="memoryBtn" type="button">Memory</button>
          <button class="btn" id="mcpBtn" type="button">MCP</button>
          <button class="btn" id="traceBtn" type="button">Trace</button>
          <button class="btn icon" id="refreshBtn" type="button" title="Refresh status" aria-label="Refresh status">↻</button>
        </div>
      </header>

      <div class="content-grid trace-hidden" id="contentGrid">
        <section class="messages" id="messages"></section>
        <section class="trace-panel" id="tracePanel" hidden>
          <div class="trace-head">
            <h3>Run trace</h3>
            <button class="btn icon" id="traceRefreshBtn" type="button" title="Refresh trace" aria-label="Refresh trace">↻</button>
          </div>
          <div class="trace-meta" id="traceMeta">No trace loaded.</div>
          <div class="trace-list" id="traceList"></div>
          <div class="trace-head">
            <h3>MCP</h3>
            <button class="btn icon" id="mcpRefreshBtn" type="button" title="Refresh MCP" aria-label="Refresh MCP">↻</button>
          </div>
          <div class="trace-meta" id="mcpMeta">No MCP data loaded.</div>
          <div class="mcp-list" id="mcpList"></div>
          <div class="trace-head">
            <h3>Memory</h3>
            <button class="btn icon" id="memoryRefreshBtn" type="button" title="Refresh memory" aria-label="Refresh memory">↻</button>
          </div>
          <div class="trace-meta" id="memoryMeta">No memory data loaded.</div>
          <div class="mcp-list" id="memoryList"></div>
        </section>
      </div>

      <form class="composer" id="composer">
        <div class="error" id="errorText"></div>
        <div class="composer-row">
          <textarea id="promptInput" placeholder="输入消息..." autocomplete="off"></textarea>
          <div class="toolbar">
            <button class="btn" id="stopBtn" type="button" disabled>Stop</button>
            <button class="btn primary" id="sendBtn" type="submit">Send</button>
          </div>
        </div>
      </form>
    </main>
  </div>

  <script>
    const state = {
      sessions: {},
      current: "",
      model: "ricbot",
      controller: null,
      busy: false
    };

    const els = {
      statusDot: document.getElementById("statusDot"),
      statusText: document.getElementById("statusText"),
      sessionInput: document.getElementById("sessionInput"),
      tokenInput: document.getElementById("tokenInput"),
      streamToggle: document.getElementById("streamToggle"),
      sessionList: document.getElementById("sessionList"),
      sessionTitle: document.getElementById("sessionTitle"),
      modelMeta: document.getElementById("modelMeta"),
      messages: document.getElementById("messages"),
      composer: document.getElementById("composer"),
      promptInput: document.getElementById("promptInput"),
      errorText: document.getElementById("errorText"),
      sendBtn: document.getElementById("sendBtn"),
      stopBtn: document.getElementById("stopBtn"),
      newSessionBtn: document.getElementById("newSessionBtn"),
      clearBtn: document.getElementById("clearBtn"),
      refreshBtn: document.getElementById("refreshBtn"),
      memoryBtn: document.getElementById("memoryBtn"),
      memoryRefreshBtn: document.getElementById("memoryRefreshBtn"),
      mcpBtn: document.getElementById("mcpBtn"),
      mcpRefreshBtn: document.getElementById("mcpRefreshBtn"),
      traceBtn: document.getElementById("traceBtn"),
      traceRefreshBtn: document.getElementById("traceRefreshBtn"),
      contentGrid: document.getElementById("contentGrid"),
      tracePanel: document.getElementById("tracePanel"),
      traceMeta: document.getElementById("traceMeta"),
      traceList: document.getElementById("traceList"),
      mcpMeta: document.getElementById("mcpMeta"),
      mcpList: document.getElementById("mcpList"),
      memoryMeta: document.getElementById("memoryMeta"),
      memoryList: document.getElementById("memoryList")
    };

    function storageKey() {
      return "ricbot.webui.v1";
    }

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey()) || "{}");
        state.sessions = saved.sessions || {};
        state.current = saved.current || "";
        els.streamToggle.checked = saved.stream !== false;
        els.tokenInput.value = sessionStorage.getItem("ricbot.webui.token") || "";
      } catch (_) {
        state.sessions = {};
      }
      if (!state.current || !state.sessions[state.current]) {
        createSession(false);
      }
    }

    function saveState() {
      localStorage.setItem(storageKey(), JSON.stringify({
        sessions: state.sessions,
        current: state.current,
        stream: els.streamToggle.checked
      }));
      sessionStorage.setItem("ricbot.webui.token", els.tokenInput.value.trim());
    }

    function createSession(render = true) {
      const id = "web-" + new Date().toISOString().replace(/[-:.TZ]/g, "").slice(0, 14);
      state.sessions[id] = [];
      state.current = id;
      els.sessionInput.value = id;
      saveState();
      if (render) renderAll();
      return id;
    }

    function currentMessages() {
      if (!state.sessions[state.current]) state.sessions[state.current] = [];
      return state.sessions[state.current];
    }

    function setBusy(value) {
      state.busy = value;
      els.sendBtn.disabled = value;
      els.stopBtn.disabled = !value;
      els.promptInput.disabled = value;
    }

    function headers() {
      const out = {"Content-Type": "application/json"};
      const token = els.tokenInput.value.trim();
      if (token) out.Authorization = "Bearer " + token;
      return out;
    }

    async function refreshStatus() {
      clearError();
      try {
        const health = await fetch("/health", {headers: headers()});
        if (!health.ok) throw new Error(await readError(health));
        const models = await fetch("/v1/models", {headers: headers()});
        if (!models.ok) throw new Error(await readError(models));
        const modelJson = await models.json();
        const first = modelJson.data && modelJson.data[0];
        state.model = first && first.id ? first.id : "ricbot";
        els.modelMeta.textContent = "Model: " + state.model;
        setStatus("ok", "Ready");
      } catch (err) {
        setStatus("err", "Auth needed");
        showError(err.message || String(err));
      }
    }

    function setStatus(kind, text) {
      els.statusDot.className = "dot " + (kind || "");
      els.statusText.textContent = text;
    }

    async function readError(response) {
      try {
        const json = await response.json();
        return json.error && json.error.message ? json.error.message : response.statusText;
      } catch (_) {
        return response.status + " " + response.statusText;
      }
    }

    function showError(text) {
      els.errorText.textContent = text || "";
    }

    function clearError() {
      els.errorText.textContent = "";
    }

    function renderAll() {
      els.sessionInput.value = state.current;
      els.sessionTitle.textContent = state.current;
      renderSessions();
      renderMessages();
    }

    function renderSessions() {
      els.sessionList.textContent = "";
      const ids = Object.keys(state.sessions).sort().reverse();
      for (const id of ids) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "session-button" + (id === state.current ? " active" : "");
        button.textContent = id;
        button.title = id;
        button.addEventListener("click", () => {
          state.current = id;
          saveState();
          renderAll();
        });
        els.sessionList.appendChild(button);
      }
    }

    function renderMessages() {
      els.messages.textContent = "";
      const list = currentMessages();
      if (list.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "开始一个会话。";
        els.messages.appendChild(empty);
        return;
      }
      for (const msg of list) {
        appendMessageElement(msg);
      }
      scrollMessages();
    }

    function appendMessageElement(msg) {
      const wrapper = document.createElement("article");
      wrapper.className = "msg " + msg.role;
      const role = document.createElement("div");
      role.className = "role";
      role.textContent = msg.role === "user" ? "You" : "Ricbot";
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = msg.content || "";
      wrapper.append(role, bubble);
      els.messages.appendChild(wrapper);
      msg._el = bubble;
      return bubble;
    }

    function scrollMessages() {
      els.messages.scrollTop = els.messages.scrollHeight;
    }

    async function sendMessage(text) {
      clearError();
      const messages = currentMessages();
      const user = {role: "user", content: text};
      const assistant = {role: "assistant", content: ""};
      messages.push(user, assistant);
      saveState();
      renderMessages();
      setBusy(true);
      state.controller = new AbortController();

      try {
        if (els.streamToggle.checked) {
          await sendStreaming(messages, assistant);
        } else {
          await sendBlocking(messages, assistant);
        }
        saveState();
        if (!els.tracePanel.hidden) refreshTrace();
      } catch (err) {
        if (err.name !== "AbortError") {
          assistant.content = assistant.content || "请求失败。";
          showError(err.message || String(err));
        }
      } finally {
        state.controller = null;
        setBusy(false);
        renderMessages();
      }
    }

    async function sendBlocking(messages, assistant) {
      const payload = requestPayload(messages, false);
      const response = await fetch("/v1/chat/completions", {
        method: "POST",
        headers: headers(),
        body: JSON.stringify(payload),
        signal: state.controller.signal
      });
      if (!response.ok) throw new Error(await readError(response));
      const json = await response.json();
      const choice = json.choices && json.choices[0];
      assistant.content = choice && choice.message ? choice.message.content || "" : "";
    }

    async function sendStreaming(messages, assistant) {
      const payload = requestPayload(messages, true);
      const response = await fetch("/v1/chat/completions", {
        method: "POST",
        headers: headers(),
        body: JSON.stringify(payload),
        signal: state.controller.signal
      });
      if (!response.ok) throw new Error(await readError(response));
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      while (true) {
        const {done, value} = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, {stream: true});
        const parts = buffer.split("\n\n");
        buffer = parts.pop() || "";
        for (const part of parts) {
          consumeSse(part, assistant);
        }
      }
      if (buffer) consumeSse(buffer, assistant);
    }

    function consumeSse(block, assistant) {
      const lines = block.split("\n").filter(line => line.startsWith("data:"));
      for (const line of lines) {
        const data = line.slice(5).trim();
        if (!data || data === "[DONE]") continue;
        try {
          const json = JSON.parse(data);
          const choice = json.choices && json.choices[0];
          const delta = choice && choice.delta;
          if (delta && delta.content) {
            assistant.content += delta.content;
            if (assistant._el) assistant._el.textContent = assistant.content;
            scrollMessages();
          }
        } catch (_) {
        }
      }
    }

    function requestPayload(messages, stream) {
      const outbound = messages.slice();
      const last = outbound[outbound.length - 1];
      if (last && last.role === "assistant" && !last.content) {
        outbound.pop();
      }
      return {
        model: state.model,
        session_id: state.current,
        stream,
        messages: outbound
          .filter(msg => msg.role === "user" || msg.role === "assistant")
          .map(msg => ({role: msg.role, content: msg.content || ""}))
      };
    }

    async function refreshTrace() {
      clearError();
      try {
        const response = await fetch("/v1/sessions/" + encodeURIComponent(state.current) + "/trace", {headers: headers()});
        if (!response.ok) throw new Error(await readError(response));
        renderTrace(await response.json());
      } catch (err) {
        showError(err.message || String(err));
      }
    }

    async function refreshMcp() {
      clearError();
      try {
        const response = await fetch("/v1/mcp", {headers: headers()});
        if (!response.ok) throw new Error(await readError(response));
        renderMcp(await response.json());
      } catch (err) {
        showError(err.message || String(err));
      }
    }

    async function refreshMemory() {
      clearError();
      try {
        const response = await fetch("/v1/memory", {headers: headers()});
        if (!response.ok) throw new Error(await readError(response));
        renderMemory(await response.json());
      } catch (err) {
        showError(err.message || String(err));
      }
    }

    function renderMcp(data) {
      const servers = Array.isArray(data.servers) ? data.servers : [];
      const tools = Array.isArray(data.tools) ? data.tools : [];
      els.mcpMeta.textContent = "Configured: " + (data.configured_count || 0)
        + " · Connected: " + (data.connected_count || 0)
        + " · Tools: " + tools.length;
      els.mcpList.textContent = "";
      if (!servers.length && !tools.length) {
        const empty = document.createElement("div");
        empty.className = "trace-meta";
        empty.textContent = "暂无 MCP server。";
        els.mcpList.appendChild(empty);
        return;
      }
      for (const server of servers) {
        const item = document.createElement("div");
        item.className = "mcp-item";
        const title = document.createElement("strong");
        title.textContent = server.name || "server";
        const detail = document.createElement("span");
        detail.textContent = "status=" + (server.status || "-")
          + " · health=" + (server.health || "-")
          + " · type=" + (server.type || "-")
          + " · registered=" + (server.registered_count || 0)
          + (server.error ? " · error=" + server.error : "");
        item.append(title, detail);
        els.mcpList.appendChild(item);
      }
      for (const tool of tools.slice(0, 40)) {
        const item = document.createElement("div");
        item.className = "mcp-item";
        const title = document.createElement("strong");
        title.textContent = tool.name || "tool";
        const detail = document.createElement("span");
        detail.textContent = "server=" + (tool.server || "-")
          + " · risk=" + (tool.risk || "-")
          + " · read_only=" + Boolean(tool.read_only)
          + " · concurrent_safe=" + Boolean(tool.concurrent_safe);
        item.append(title, detail);
        els.mcpList.appendChild(item);
      }
    }

    function renderMemory(data) {
      const candidates = Array.isArray(data.candidates) ? data.candidates : [];
      els.memoryMeta.textContent = "Entries: " + (data.entries_count || 0)
        + " · Active: " + (data.active_count || 0)
        + " · Pending: " + (data.pending_candidates || 0)
        + " · Sensitive: " + (data.sensitive_candidates || 0);
      els.memoryList.textContent = "";
      if (!candidates.length) {
        const empty = document.createElement("div");
        empty.className = "trace-meta";
        empty.textContent = "暂无候选记忆。";
        els.memoryList.appendChild(empty);
        return;
      }
      for (const candidate of candidates) {
        const item = document.createElement("div");
        item.className = "mcp-item";
        const title = document.createElement("strong");
        title.textContent = candidate.summary || "memory candidate";
        const detail = document.createElement("span");
        detail.textContent = "type=" + (candidate.type || "-")
          + " · sensitivity=" + (candidate.sensitivity || "-")
          + " · approval=" + (candidate.approval_status || "-")
          + " · source=" + (candidate.source || "-");
        item.append(title, detail);
        if (candidate.approval_status === "pending") {
          const actions = document.createElement("div");
          actions.className = "toolbar";
          const approve = document.createElement("button");
          approve.type = "button";
          approve.className = "btn";
          approve.textContent = "Approve";
          approve.addEventListener("click", () => updateMemoryCandidate(candidate.id, "approve"));
          const reject = document.createElement("button");
          reject.type = "button";
          reject.className = "btn";
          reject.textContent = "Reject";
          reject.addEventListener("click", () => updateMemoryCandidate(candidate.id, "reject"));
          actions.append(approve, reject);
          item.appendChild(actions);
        }
        els.memoryList.appendChild(item);
      }
    }

    async function updateMemoryCandidate(id, action) {
      if (!id || !action) return;
      clearError();
      try {
        const response = await fetch("/v1/memory/candidates/" + encodeURIComponent(id) + "/" + action, {
          method: "POST",
          headers: headers()
        });
        if (!response.ok) throw new Error(await readError(response));
        renderMemory(await response.json());
      } catch (err) {
        showError(err.message || String(err));
      }
    }

    function renderTrace(data) {
      const run = data.run_trace || {};
      const context = data.context_trace || {};
      const events = Array.isArray(run.events) ? run.events : [];
      els.traceMeta.textContent = "Stop: " + (run.stop_reason || "-")
        + " · Iterations: " + (run.iterations || 0)
        + " · Tools: " + ((run.tools_used || []).join(", ") || "-")
        + " · Context: " + (context.combined_context_chars || 0) + " chars";
      els.traceList.textContent = "";
      const displayEvents = contextTraceEvents(context).concat(events.slice(-24));
      if (!displayEvents.length) {
        const empty = document.createElement("div");
        empty.className = "trace-meta";
        empty.textContent = "暂无运行轨迹。";
        els.traceList.appendChild(empty);
        return;
      }
      for (const event of displayEvents) {
        const item = document.createElement("div");
        item.className = "trace-item";
        const title = document.createElement("strong");
        title.textContent = "#" + (event.iteration || 0) + " " + (event.type || "event");
        const detail = document.createElement("code");
        detail.textContent = traceSummary(event);
        item.append(title, detail);
        els.traceList.appendChild(item);
      }
    }

    function contextTraceEvents(context) {
      if (!context || !Object.keys(context).length) return [];
      const events = [{
        type: "context_budget",
        iteration: 0,
        history_candidates: context.history_candidates || 0,
        history_selected: context.history_selected || 0,
        initial_message_count: context.initial_message_count || 0,
        structured_context_chars: context.structured_context_chars || 0,
        skills_context_chars: context.skills_context_chars || 0,
        combined_context_chars: context.combined_context_chars || 0
      }];
      const budget = context.prompt_context_budget || {};
      if (Array.isArray(budget.sections)) {
        for (const section of budget.sections) {
          if ((section.candidates || 0) > 0 || (section.emitted || 0) > 0) {
            events.push({
              type: "context_section",
              iteration: 0,
              section: section.name,
              candidates: section.candidates,
              emitted: section.emitted,
              omitted: section.omitted,
              max_items: section.max_items,
              max_chars: section.max_chars,
              truncated: section.truncated
            });
          }
        }
      }
      return events;
    }

    function traceSummary(event) {
      const copy = {...event};
      delete copy.type;
      delete copy.iteration;
      delete copy.at;
      return JSON.stringify(copy, null, 2);
    }

    els.composer.addEventListener("submit", event => {
      event.preventDefault();
      const text = els.promptInput.value.trim();
      if (!text || state.busy) return;
      els.promptInput.value = "";
      sendMessage(text);
    });

    els.promptInput.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        els.composer.requestSubmit();
      }
    });

    els.stopBtn.addEventListener("click", () => {
      if (state.controller) state.controller.abort();
    });

    els.newSessionBtn.addEventListener("click", () => createSession(true));

    els.clearBtn.addEventListener("click", () => {
      state.sessions[state.current] = [];
      saveState();
      renderMessages();
    });

    els.refreshBtn.addEventListener("click", refreshStatus);

    els.memoryBtn.addEventListener("click", () => {
      const show = els.tracePanel.hidden;
      els.tracePanel.hidden = false;
      els.contentGrid.classList.remove("trace-hidden");
      refreshMemory();
      if (show) refreshTrace();
    });

    els.mcpBtn.addEventListener("click", () => {
      const show = els.tracePanel.hidden;
      els.tracePanel.hidden = false;
      els.contentGrid.classList.remove("trace-hidden");
      refreshMcp();
      if (show) refreshTrace();
    });

    els.traceBtn.addEventListener("click", () => {
      const show = els.tracePanel.hidden;
      els.tracePanel.hidden = !show;
      els.contentGrid.classList.toggle("trace-hidden", !show);
      if (show) {
        refreshTrace();
        refreshMcp();
        refreshMemory();
      }
    });

    els.traceRefreshBtn.addEventListener("click", refreshTrace);
    els.mcpRefreshBtn.addEventListener("click", refreshMcp);
    els.memoryRefreshBtn.addEventListener("click", refreshMemory);

    els.sessionInput.addEventListener("change", () => {
      const value = els.sessionInput.value.trim();
      if (!value) {
        els.sessionInput.value = state.current;
        return;
      }
      if (!state.sessions[value]) state.sessions[value] = [];
      state.current = value;
      saveState();
      renderAll();
      if (!els.tracePanel.hidden) refreshTrace();
    });

    els.tokenInput.addEventListener("change", () => {
      saveState();
      refreshStatus();
    });

    els.streamToggle.addEventListener("change", saveState);

    loadState();
    renderAll();
    refreshStatus();
  </script>
</body>
</html>

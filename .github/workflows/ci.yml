name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Production release gate
        run: sh scripts/release-check.sh

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/eval-artifacts/
            target/eval-lint/
            target/eval-smoke-fast-artifacts/
            target/eval-smoke-artifacts/
            target/eval-replayable-artifacts/
            target/eval-replay-artifacts/
            target/release-check-report.md
            target/release-check-logs/
            target/ricbot-test.log
          if-no-files-found: ignore
